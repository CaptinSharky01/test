<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Wisdom Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Random Wisdom</h1>
    <div class="card" id="card">
      <p class="quote" id="quote">Click the button to get your daily wisdom.</p>
      <span class="author" id="author"></span>
    </div>
    <button id="btn" onclick="newQuote()">Generate</button>
    <button id="copy-btn" onclick="copyQuote()">Copy</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
